<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة العروسين | إدارة الدعوة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">
<main class="admin">
<section id="adminLogin" class="card login-card">
  <p class="section-kicker">PRIVATE DASHBOARD</p>
  <h2>لوحة العروسين</h2>
  <p class="muted">تسجيل الدخول لحماية قائمة المدعوين.</p>
  <form id="adminForm">
    <label>البريد الإلكتروني<input id="adminEmail" type="email" required></label>
    <label>كلمة المرور<input id="adminPassword" type="password" required></label>
    <button class="primary" type="submit">دخول</button>
  </form>
  <p id="adminError" class="error" hidden></p>
</section>

<section id="dashboard" hidden>
  <div class="admin-head">
    <div><p class="section-kicker">PRIVATE DASHBOARD</p><h1>لوحة العروسين</h1></div>
    <button class="ghost" id="logout">تسجيل الخروج</button>
  </div>
  <section class="stats">
    <div><span>إجمالي الدعوات</span><strong id="total">0</strong></div>
    <div><span>أكدوا الحضور</span><strong id="yes">0</strong></div>
    <div><span>لن يحضروا</span><strong id="no">0</strong></div>
    <div><span>إجمالي الحاضرين</span><strong id="people">0</strong></div>
  </section>
  <section class="card table-card">
    <div class="table-head"><h2>قائمة المدعوين</h2><input id="search" placeholder="بحث بالاسم أو البريد..."></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>الاسم</th><th>البريد</th><th>المرافقون</th><th>الحالة</th><th>رمز الدعوة</th></tr></thead>
        <tbody id="guestRows"></tbody>
      </table>
    </div>
  </section>
</section>
</main>
<script type="module" src="admin.js"></script>
</body>
</html>
